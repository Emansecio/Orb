name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Uma execução nova na mesma ref cancela a anterior que ficou para trás.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift:
    name: swift build + swift test
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5
        with:
          # Histórico inteiro (o repositório é pequeno): o scripts/bundle.sh deriva o número do build de
          # `git rev-list --count HEAD`, que num checkout raso daria sempre 1.
          fetch-depth: 0

      # O pacote exige Swift 6 (swift-tools-version 6.0). Em vez de fixar uma versão, escolhe o Xcode estável mais novo
      # instalado na imagem: /Applications/Xcode_<versão>.app, sem beta nem release candidate. Se a imagem não tiver
      # nenhum versionado, cai no /Applications/Xcode.app (o Xcode padrão da imagem).
      - name: Selecionar o Xcode mais novo
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -E '/Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -n 1 || true)"
          if [ -z "$latest" ] && [ -d /Applications/Xcode.app ]; then
            echo "Nenhum Xcode versionado; usando /Applications/Xcode.app"
            latest="/Applications/Xcode.app"
          fi
          if [ -z "$latest" ]; then
            echo "Nenhum Xcode encontrado em /Applications" >&2
            ls -d /Applications/Xcode* >&2 || true
            exit 1
          fi
          echo "Usando $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          swift --version

      # Sem cache de .build de propósito: o SwiftPM decide o que recompilar pela data dos arquivos, e num checkout novo
      # todos os fontes são mais recentes que o cache, então ele recompilaria tudo igual. Não há dependências externas
      # (nem Package.resolved) para baixar. Se o tempo de build incomodar, reavaliar.

      - name: Compilar
        run: swift build

      # O release não tem as telas de revisão (--snapshot etc. ficam atrás de #if DEBUG || ORB_DEV_TOOLS) e precisa compilar
      # sozinho: sem este passo, um símbolo de produção escondido por engano nesse #if só quebraria no bundle.sh.
      - name: Compilar (release)
        run: swift build -c release

      # Em série: a máquina do CI tem poucos núcleos, e com ~3900 testes em paralelo os que esperam por algo (processos,
      # servidores falsos, prazos de rede) estouram o tempo. Aqui leva ~2 min; no CI, alguns minutos.
      # A saída vai também para um arquivo (tee, com pipefail para a falha do swift test não se perder) que o passo
      # seguinte lê para contar o que rodou, falhou e foi pulado.
      - name: Rodar os testes
        env:
          # A suíte padrão usa servidores e drivers falsos; integração com navegadores reais é local e explícita.
          ORB_SKIP_REAL_BROWSER_TESTS: '1'
        run: |
          set -o pipefail
          swift test --no-parallel 2>&1 | tee "$RUNNER_TEMP/swift-test.log"

      # Roda mesmo se os testes falharem. Os testes que dependem de Python, Acessibilidade, Gravação de Tela ou de um
      # navegador real (.enabled(if:)) são pulados sem erro; aqui eles aparecem, para que um "tudo verde" que na verdade
      # pulou metade da suíte não passe despercebido.
      - name: Resumo dos testes
        if: always()
        run: |
          log="$RUNNER_TEMP/swift-test.log"
          if [ ! -f "$log" ]; then
            echo "Sem log de testes (o passo anterior nem começou)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Swift Testing (formato do console): "✔ Test nome() passed after …", "✘ Test nome() failed after …",
          # "<símbolo> Test nome() skipped: motivo" e, no fim, "Test run with N tests … passed|failed after …".
          # Uma linha por teste (parametrizado ou não); as suítes são "Suite …" e a linha final "Test run …" é excluída.
          tests() { grep -E "^[^ ]+ Test .* $1" "$log" | grep -v 'Test run with' | sort -u || true; }
          count() { tests "$1" | grep -c . || true; }
          passed="$(count 'passed after')"
          failed="$(count 'failed after')"
          skipped="$(count 'skipped')"
          final="$(grep -E 'Test run with [0-9]+ tests?' "$log" | tail -n 1 || true)"
          {
            echo "## Resumo dos testes"
            echo
            echo "| Passaram | Falharam | Pulados |"
            echo "| ---: | ---: | ---: |"
            echo "| $passed | $failed | $skipped |"
            echo
            if [ -n "$final" ]; then echo "Linha final do Swift Testing: \`$final\`"; echo; fi
            if [ "$failed" -gt 0 ]; then
              echo "### Falharam"
              echo '```'
              tests 'failed after' | head -n 100
              echo '```'
            fi
            if [ "$skipped" -gt 0 ]; then
              echo "### Pulados (dependem de Python, Acessibilidade ou navegador real)"
              echo '```'
              tests 'skipped' | head -n 100
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # O app empacotado de verdade: o bundle.sh monta o Orb.app (ícone, Info.plist com a versão do git) e assina. No CI
      # não há a identidade "Orb Local", então ele cai na assinatura ad-hoc; não abre nem encerra o app. Em debug, que reaproveita
      # o build do swift test; vem depois dele para uma falha aqui não esconder o resultado dos testes.
      - name: Montar e assinar o Orb.app
        run: |
          set -euo pipefail
          scripts/bundle.sh debug
          app=build/Orb.app
          test -f "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/Orb"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "Versão do bundle: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist") (build $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist"), commit $(/usr/libexec/PlistBuddy -c 'Print :OrbGitCommit' "$app/Contents/Info.plist"))"
